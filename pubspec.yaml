name: hisab_diary
description: Offline household delivery diary for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  intl: ^0.20.2
  flutter_svg: ^2.2.0
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0
  flutter_timezone: ^5.0.1
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.3
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_performance: ^0.11.6
  in_app_review: ^2.0.12
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/illustrations/
    - assets/branding/
    - assets/fonts/NotoSansTamil.LICENSE.txt
    - assets/fonts/NotoSansArabic.LICENSE.txt
    - assets/fonts/NotoSansBengali.LICENSE.txt
    - assets/fonts/NotoSansTelugu.LICENSE.txt
    - assets/fonts/NotoSansKannada.LICENSE.txt
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
          weight: 600
        - asset: assets/fonts/Baloo2.ttf
          weight: 800
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari.ttf
          weight: 700
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati.ttf
          weight: 500
        - asset: assets/fonts/NotoSansGujarati.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTamil.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali.ttf
          weight: 700
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTelugu.ttf
          weight: 700
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKannada.ttf
          weight: 700
